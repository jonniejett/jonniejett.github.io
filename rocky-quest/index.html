function moveBody(b,dt,oneway=true){const r={wall:0,ground:false,head:null};
  b.x+=b.vx*dt;const y0=Math.floor(b.y+.02),y1=Math.floor(b.y+b.h-.02);
  if(b.vx>0){const cx=Math.floor(b.x+b.w/2);for(let y=y0;y<=y1;y++)if(solidAt(cx,y)){b.x=cx-b.w/2-.001;r.wall=1;break}}
  else if(b.vx<0){const cx=Math.floor(b.x-b.w/2);for(let y=y0;y<=y1;y++)if(solidAt(cx,y)){b.x=cx+1+b.w/2+.001;r.wall=-1;break}}
  const py=b.y;b.y+=b.vy*dt;const x0=Math.floor(b.x-b.w/2+.02),x1=Math.floor(b.x+b.w/2-.02);
  if(b.vy<=0){const cy=Math.floor(b.y);for(let x=x0;x<=x1;x++){const t=tileAt(x,cy);if(SOLID.has(t)||(oneway&&t==='-'&&py>=cy+1-.05)){b.y=cy+1;b.vy=0;r.ground=true;break}}}

function showHow(){state='title';panel(`<h2>Rocky's <span>Rockland Quest</span></h2><p>King Grumbler and his angry acorns stole every snack in Rockland! Help <b>Rocky the raccoon</b> run from Harriman Woods all the way to High Tor Fort.</p>
  <p>◀ ▶ move · <b>JUMP</b> (hold for higher) · hold <b>RUN</b> to go faster</p><p>🦶 Stomp Grumblers, bees and crows. Don't stomp spiky hedgehogs!</p><p>📦 Bump crates from below: 🥯 Bagel = Big Rocky · 🌶️ Hot Sauce = throw fireballs · 🪁 Kite = glide · ⛑️ WNFD helmet = unstoppable</p><p>🌰 Grab 50 acorns for an extra life. 🔔 Jump high at the finish gate for a bonus!</p><button id="go">To the map 🗺️</button>`);$('go').onclick=()=>{audio();showMap()}}

// ---------- input ----------
function bindBtn(el,key){const on=e=>{e.preventDefault();audio();if(!I[key])I[key+'P']=true;I[key]=true;el.classList.add('on')},off=e=>{I[key]=false;el.classList.remove('on')};
  el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('pointerleave',off)}
bindBtn($('bA'),'a');bindBtn($('bB'),'b');
{const dp=$('dpad'),ptr=new Map();const upd=()=>{I.l=[...ptr.values()].includes(-1);I.r=[...ptr.values()].includes(1);$('bL').classList.toggle('on',I.l);$('bR').classList.toggle('on',I.r)};
  const side=e=>{const r=dp.getBoundingClientRect();return e.clientX<r.left+r.width/2?-1:1};
  dp.addEventListener('pointerdown',e=>{e.preventDefault();audio();try{dp.setPointerCapture(e.pointerId)}catch(_){}ptr.set(e.pointerId,side(e));upd()});
  dp.addEventListener('pointermove',e=>{if(ptr.has(e.pointerId)){ptr.set(e.pointerId,side(e));upd()}});
  const end=e=>{ptr.delete(e.pointerId);upd()};dp.addEventListener('pointerup',end);dp.addEventListener('pointercancel',end)}
const KM={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',Space:'a',ArrowUp:'a',KeyZ:'a',KeyW:'a',KeyX:'b',ShiftLeft:'b',ShiftRight:'b'};
addEventListener('keydown',e=>{const k=KM[e.code];if(!k)return;e.preventDefault();audio();if(!I[k]&&(k==='a'||k==='b'))I[k+'P']=true;I[k]=true});
addEventListener('keyup',e=>{const k=KM[e.code];if(k)I[k]=false});
document.addEventListener('gesturestart',e=>e.preventDefault());

// ---------- loop ----------
const clock=new THREE.Clock();
function frame(){requestAnimationFrame(frame);const dt=Math.min(.033,clock.getDelta());t+=dt;
  if(state==='play'){timeLeft-=dt;if(timeLeft<=0){timeLeft=0;die()}if(Math.ceil(timeLeft)!==+$('time').textContent.slice(2))hud();
    updatePlats(dt);updatePlayer(dt);updateEnemies(dt);updateItems(dt);updateFires(dt)}
  else if(state==='dying'){deathT+=dt;if(deathT>.4){P.vy-=G*.7*dt;P.y+=P.vy*dt}heroWrap.rotation.z=Math.min(Math.PI,deathT*6);if(deathT>2.2)afterDeath()}
  else if(state==='clear'){clearT+=dt;updatePlats(dt);P.vx=4;P.face=1;P.vy-=G*dt;const r=moveBody(P,dt);P.ground=r.ground;if(goal.ring>0){goal.ring-=dt*.5;goal.bell.rotation.z=Math.sin(clearT*18)*goal.ring*.6}
    if(clearT>1&&Math.random()<.2)part(goal.x+rnd(-3,3),rnd(5,9),rnd(-2,2),rnd(2,6),[0xff4060,0xffd030,0x40c0ff,0x60e060][Math.floor(Math.random()*4)],.18,1.2);
    if(clearT>3.2){if(LV===4){state='won';saveBest();panel(`<h2>🏆 Rockland is saved!</h2><p>Rocky beat <b>King Grumbler</b> and got every snack back for Rockland.</p><p style="font-size:24px"><b>${score}</b> points</p><p>Best: ${best}</p><button id="go">Back to the map</button>`);$('go').onclick=showMap}else{sel=Math.min(LV+1,unlocked-1);showMap()}}}
  else if(state==='map'||state==='title'){P.x=camX;}
  I.aP=I.bP=false;
  // hero visuals
  if(state!=='map'&&state!=='title'){const u=hero.userData;const tgt=P.face>0?-Math.PI/2-.35:Math.PI/2+.35;hero.rotation.y+=(tgt-hero.rotation.y)*Math.min(1,dt*16);
    let sc=P.pow?1.32:.9;if(growT>0){growT-=dt;sc*=1+Math.sin(growT*40)*.12}hero.scale.setScalar(sc);
    const sp=Math.abs(P.vx);P.anim+=dt*(4+sp*2.2);const run=P.ground&&sp>.3;u.legs.forEach((l,k)=>l.rotation.x=run?Math.sin(P.anim+(k%2?Math.PI:0))*.9:0);
    hero.position.y=run?Math.abs(Math.sin(P.anim))*.06:0;hero.rotation.x=P.ground?0:clamp(-P.vy*.02,-.35,.35)*(P.face);u.tail.rotation.z=Math.sin(t*(run?14:5))*.3;
    if(u.kite.visible)u.kite.rotation.z=P.glide?Math.sin(t*10)*.15:0,u.kite.scale.setScalar(P.glide?1.4:1);
    if(P.star>0){u.helm.children[0].material.emissive.setHSL((t*2)%1,1,.3);u.scarfM.color.setHSL((t*1.5)%1,1,.55)}else if(state==='play')setPowColor();
    heroWrap.position.set(P.x,P.y,0);heroWrap.visible=state==='dying'||P.inv<=0||Math.floor(t*18)%2===0}
  for(const n of nuts)if(!n.got)n.mesh.rotation.y=t*3+n.x;
  for(const [k,c] of crates)if(c.bump>0){c.bump=Math.max(0,c.bump-dt*6);const [x,y]=k.split(',').map(Number);c.mesh.position.y=y+.5+Math.sin(c.bump*Math.PI)*.3}
  bgGroup.children.forEach(o=>{if(o.userData.ff!==undefined){o.userData.ff+=dt;o.material.opacity=.5+Math.sin(o.userData.ff*3)*.4;if(th.bg==='night')o.position.y+=Math.sin(o.userData.ff)*dt*.3}});
  updateParts(dt);if(state!=='map'&&state!=='title')updateCam(dt);else{camX+=dt*1.5;if(camX>W-viewW/2)camX=viewW/2;camera.position.set(camX,camY+1.2,dist);camera.lookAt(camX,camY+.4,0);sun.position.set(camX-10,camY+22,18);sun.target.position.set(camX,camY-4,0)}
  render(dt)}
let lastPow=-1;function setPowColor(){if(lastPow!==P.pow||P.star<=0){const p=P.pow;hero.userData.scarfM.color.set(p===2?0xff2020:p===3?0x2ab0ff:0xff8a1a);lastPow=P.pow}}

// debug hooks
window.__rq={P,I,get state(){return state},get LV(){return LV},startLevel,get enemies(){return enemies},get items(){return items},get goal(){return goal},get grid(){return grid},get W(){return W},setPow,collect,get lives(){return lives},showMap,
  unlockAll(){unlocked=5;store.set('unlocked',5)},tp(x,y){P.x=x;P.y=y;P.vx=P.vy=0}};

buildLevel(0);fitCam();camY=padOff+.6;camX=viewW/2;
$('loading').remove();showHow();frame();
</script>
