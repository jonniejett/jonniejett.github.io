<style>
html,body{background:#020308}
.lcol{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.ibs{display:flex;gap:6px}
.ib{pointer-events:auto;background:rgba(0,0,0,.38);border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:999px;width:40px;height:34px;font-size:15px;display:grid;place-items:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:0}
#lives{color:#5ef0ff;letter-spacing:1px;font-size:20px}
#combo{font-weight:900;color:#ffd166;font-size:15px;min-height:18px;margin-top:2px;text-shadow:0 0 10px rgba(255,180,40,.8)}
#modchip{position:fixed;top:calc(max(10px,env(safe-area-inset-top)) + 72px);left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;letter-spacing:.04em;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:4px 11px;white-space:nowrap;pointer-events:none;z-index:5;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#bossbar{position:fixed;top:calc(max(10px,env(safe-area-inset-top)) + 100px);left:50%;transform:translateX(-50%);width:min(56vw,300px);height:10px;border-radius:9px;background:rgba(0,0,0,.5);border:1px solid rgba(255,120,60,.6);overflow:hidden;z-index:5;pointer-events:none}
#bossbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff3a1a,#ffb02a);box-shadow:0 0 12px #ff6a20}
#ctrl{position:fixed;left:0;right:0;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 22px);display:flex;justify-content:space-between;padding:0 20px;pointer-events:none;z-index:6}
.cb{pointer-events:auto;width:80px;height:80px;border-radius:50%;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:27px;line-height:1;color:#fff;background:rgba(10,16,30,.42);border:2px solid rgba(255,255,255,.22);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);touch-action:none;transition:transform .08s,box-shadow .2s,border-color .2s}
.cb small{font-size:10px;letter-spacing:.14em;font-weight:800;opacity:.92;margin-top:4px}
.cb .ring{position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p,0)*1turn),rgba(255,255,255,.06) 0);-webkit-mask:radial-gradient(circle,transparent 36px,#000 37px);mask:radial-gradient(circle,transparent 36px,#000 37px);pointer-events:none}
.cb.ready{border-color:var(--c);box-shadow:0 0 22px var(--c)}
.cb.on{transform:scale(.9)}

.pop{position:fixed;left:0;top:0;font-weight:900;font-size:15px;color:#fff;text-shadow:0 0 8px rgba(0,200,255,.9),0 2px 4px rgba(0,0,0,.8);pointer-events:none;z-index:4;white-space:nowrap}

.banner small{display:block;font-size:15px;color:#fff;font-weight:600;margin-top:6px;opacity:.9}
.panel{max-height:calc(100vh - 32px);overflow:auto;max-width:380px}
.panel.wide{max-width:640px}
.panel h2 span{color:#5ef0ff}
.panel h2{font-size:32px;letter-spacing:.06em}
.panel button.main{background:linear-gradient(180deg,#8ef8ff,#1fb6e0);color:#001a22;box-shadow:0 6px 24px rgba(31,182,224,.45)}
.panel .sub{font-size:13px;opacity:.7}
.panel a.alt{display:inline-block;margin-top:12px;color:#cfe;opacity:.8;font-size:14px}
.cards{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.panel button.card{margin:0;display:flex;gap:12px;align-items:center;text-align:left;background:rgba(255,255,255,.07);border:1px solid rgba(94,240,255,.35);border-radius:16px;padding:12px 14px;color:#fff;font:15px system-ui,-apple-system,sans-serif;box-shadow:none;width:100%}
.panel button.card:active{background:rgba(94,240,255,.25)}
.card .ic{font-size:32px;flex:none}
.card b{font-size:16px;display:block;margin-bottom:2px}
.card span{font-size:13px;opacity:.85;line-height:1.35;display:block}
.card i{font-style:normal;color:#5ef0ff;font-size:11px;font-weight:700;letter-spacing:.08em}
.stats{font-size:14px;line-height:1.6;margin:8px 0}
.stats b{color:#ffd166}
@media (orientation:landscape) and (min-width:700px){.cards{flex-direction:row}.panel button.card{flex-direction:column;text-align:center;flex:1}}
@media (max-height:700px){.cb{width:68px;height:68px;font-size:23px}.cb .ring{-webkit-mask:radial-gradient(circle,transparent 30px,#000 31px);mask:radial-gradient(circle,transparent 30px,#000 31px)}}

<script type="module">
import * as THREE from 'three';
import { makeRenderer, makeStore, canvasTex, softTex, fbm, vibrate } from '../lib/fx.js';

const $=id=>document.getElementById(id);
const store=makeStore('rs_');let best=store.get('best',0);let muted=store.get('mute',false);
const {renderer,scene,camera,render}=makeRenderer($('c'),{bloom:.8,radius:.5,threshold:.9,exposure:1.05});
renderer.shadowMap.enabled=false;
scene.background=new THREE.Color(0x020308);
const TAU=Math.PI*2,rand=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const angDiff=(a,b)=>{let d=b-a;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return d};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function mulberry(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const randUnit=()=>new THREE.Vector3(rand(-1,1),rand(-1,1),rand(-1,1)).normalize();

// ---------- sound ----------
let ac=null,thrG=null,thrOn=false;
function audio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();
  const b=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const s=ac.createBufferSource();s.buffer=b;s.loop=true;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=420;thrG=ac.createGain();thrG.gain.value=0;s.connect(f);f.connect(thrG);thrG.connect(ac.destination);s.start()}catch(e){}}
  if(ac&&ac.state==='suspended')ac.resume()}
function tn(f0,f1,d,v=.06,type='square',delay=0){if(!ac||muted)return;const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.03)}
function nz(d,f,v,type='lowpass'){if(!ac||muted)return;const n=ac.createBufferSource(),b=ac.createBuffer(1,Math.max(1,ac.sampleRate*d|0),ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/a.length,2);n.buffer=b;const fl=ac.createBiquadFilter();fl.type=type;fl.frequency.value=f;const g=ac.createGain();g.gain.value=v;n.connect(fl);fl.connect(g);g.connect(ac.destination);n.start()}
const S={
  pew:()=>tn(1500,520,.07,.016,'triangle'),
  boom:s=>{nz([.75,.5,.3][s],[450,750,1300][s],[.34,.26,.18][s]);tn([110,160,240][s],35,[.55,.38,.22][s],.09,'sine')},
  big:()=>{nz(1.3,380,.5);tn(90,22,1.2,.18,'sine')},
  clank:()=>tn(700,320,.05,.03,'square'),
  gem:()=>tn(1500,2400,.07,.035,'sine'),
  warp:()=>{tn(160,2200,.35,.05,'sawtooth');nz(.4,3000,.1,'highpass')},
  nova:()=>{nz(1.1,1500,.4,'bandpass');tn(70,22,1.1,.22,'sine')},
  die:()=>{nz(1,700,.45);tn(420,40,.9,.08,'sawtooth')},
  shield:()=>tn(300,1000,.25,.06,'triangle'),
  zap:()=>tn(800,220,.13,.025,'sawtooth'),
  missile:()=>nz(.25,2200,.06,'bandpass'),
  alarm:()=>{for(let i=0;i<3;i++)tn(520,380,.22,.05,'square',i*.35)},
  pick:()=>[523,659,784,1047].forEach((f,i)=>tn(f,f*1.01,.16,.05,'triangle',i*.08)),
  clear:()=>[392,523,659,784,1047].forEach((f,i)=>tn(f,f,.2,.05,'triangle',i*.1)),
  life:()=>[660,880,1320].forEach((f,i)=>tn(f,f,.14,.05,'sine',i*.1)),
};
function setThrust(on){if(on===thrOn||!thrG)return;thrOn=on;thrG.gain.setTargetAtTime(on&&!muted?.07:0,ac.currentTime,.06)}

// ---------- shared shaders ----------
function fresnelMat(col,pw=2.5,op=1){return new THREE.ShaderMaterial({uniforms:{col:{value:new THREE.Color(col)},op:{value:op},pw:{value:pw}},
  vertexShader:`varying vec3 vN;varying vec3 vV;void main(){vec4 mv=modelViewMatrix*vec4(position,1.);vN=normalize(normalMatrix*normal);vV=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`uniform vec3 col;uniform float op;uniform float pw;varying vec3 vN;varying vec3 vV;void main(){float f=pow(1.-abs(dot(normalize(vN),normalize(vV))),pw);gl_FragColor=vec4(col*f*op,1.);}`,
  transparent:true,blending:THREE.AdditiveBlending,depthWrite:false})}
const ptMat=new THREE.ShaderMaterial({uniforms:{scale:{value:500}},
  vertexShader:`attribute float size;attribute float alpha;attribute vec3 pcolor;varying vec3 vC;varying float vA;uniform float scale;void main(){vC=pcolor;vA=alpha;vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=alpha>0.?size*scale/-mv.z:0.;gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`varying vec3 vC;varying float vA;void main(){vec2 d=gl_PointCoord-.5;float r=dot(d,d)*4.;if(r>1.)discard;float f=1.-r;f*=f;gl_FragColor=vec4(vC*vA*f,1.);}`,
  transparent:true,blending:THREE.AdditiveBlending,depthWrite:false});
function pointCloud(n){const g=new THREE.BufferGeometry();const o={n,pos:new Float32Array(n*3),col:new Float32Array(n*3),size:new Float32Array(n),alpha:new Float32Array(n)};
  g.setAttribute('position',new THREE.BufferAttribute(o.pos,3));g.setAttribute('pcolor',new THREE.BufferAttribute(o.col,3));g.setAttribute('size',new THREE.BufferAttribute(o.size,1));g.setAttribute('alpha',new THREE.BufferAttribute(o.alpha,1));
  o.geo=g;o.pts=new THREE.Points(g,ptMat);o.pts.frustumCulled=false;o.dirty=()=>{for(const k of ['position','pcolor','size','alpha'])g.attributes[k].needsUpdate=true};return o}

// ---------- camera / play area ----------
const HALF_MIN=16,FOV=40;let HW=16,HH=24,D=60;
const stars=pointCloud(650);stars.pts.renderOrder=-2;scene.add(stars.pts);const starZ=new Float32Array(650),starB=new Float32Array(650),starPh=new Float32Array(650);
function fit(){const a=innerWidth/innerHeight;if(a<1){HW=HALF_MIN;HH=HALF_MIN/a}else{HH=HALF_MIN;HW=HALF_MIN*a}
  camera.fov=FOV;camera.aspect=a;D=HH/Math.tan(THREE.MathUtils.degToRad(FOV/2));camera.position.set(0,0,D);camera.lookAt(0,0,0);camera.near=1;camera.far=D+600;camera.updateProjectionMatrix();
  const k=(D+260)/D*1.25;neb.scale.set(HW*2*k,HH*2*k,1);
  for(let i=0;i<stars.n;i++){const z=-40-Math.random()*200,s=(D-z)/D;starZ[i]=z;stars.pos[i*3]=rand(-HW,HW)*s;stars.pos[i*3+1]=rand(-HH,HH)*s;stars.pos[i*3+2]=z;starB[i]=rand(.25,1);starPh[i]=rand(0,TAU);
    stars.size[i]=rand(.08,.26)*s;const t=Math.random();stars.col[i*3]=t<.2?1.3:1;stars.col[i*3+1]=1;stars.col[i*3+2]=t>.75?1.5:1}
  stars.dirty();placePlanet()}

// ---------- lights ----------
const hemi=new THREE.HemisphereLight(0x8fa8ff,0x1a1020,.9);scene.add(hemi);
const key=new THREE.DirectionalLight(0xfff0dd,3.2);key.position.set(-30,40,60);scene.add(key);
const rim=new THREE.DirectionalLight(0x66ccff,1.8);rim.position.set(40,-30,12);scene.add(rim);
let flashL=0;

// ---------- backdrop: nebula + planet ----------
const nebMat=new THREE.MeshBasicMaterial({depthWrite:false});const neb=new THREE.Mesh(new THREE.PlaneGeometry(1,1),nebMat);neb.position.z=-260;neb.renderOrder=-3;scene.add(neb);
const PAL=[
  {name:'Azure',base:[6,10,28],c1:[30,90,190],c2:[150,40,160],light:0x66ccff,hemi:0x8fa8ff,pl:['#d9a36a','#8a5a3a'],ring:true},
  {name:'Ember',base:[22,6,10],c1:[190,60,30],c2:[120,20,90],light:0xff8a50,hemi:0xffa080,pl:['#7fb6d9','#2a4a7a'],ring:false},
  {name:'Jade',base:[4,18,18],c1:[20,150,120],c2:[40,70,180],light:0x50ffc8,hemi:0x90ffd8,pl:['#c96a9a','#5a2a4a'],ring:true},
  {name:'Violet',base:[14,6,26],c1:[120,40,200],c2:[220,60,120],light:0xc080ff,hemi:0xb090ff,pl:['#e8d8a0','#9a7a40'],ring:false},
  {name:'Inferno',base:[20,4,4],c1:[220,70,20],c2:[255,160,40],light:0xff6030,hemi:0xff9070,pl:['#6a6a70','#2a2a30'],ring:true},
  {name:'Glacier',base:[6,14,24],c1:[60,160,220],c2:[200,230,255],light:0x9ad8ff,hemi:0xc0e8ff,pl:['#b85a3a','#5a2a1a'],ring:false},
];
function nebulaTex(p,seed){return canvasTex(256,256,(g,w,h)=>{const im=g.createImageData(w,h);for(let y=0;y<h;y++)for(let x=0;x<w;x++){const u=x/w,v=y/h;
  const n1=fbm(u*3+seed,v*3+seed*.7,5),n2=fbm(u*5+seed+9,v*5+3,4),n3=fbm(u*9+seed*2,v*9+1,3);
  const a=clamp((n1-.42)/.4,0,1),b=clamp((n2-.5)/.35,0,1),vg=1-.55*Math.hypot(u-.5,v-.5);
  const i=(y*w+x)*4;for(let c=0;c<3;c++)im.data[i+c]=clamp((p.base[c]+p.c1[c]*a*a*.85+p.c2[c]*b*b*.7*(.6+.6*n3))*vg,0,255);im.data[i+3]=255}
  g.putImageData(im,0,0)})}
function planetTex(p,seed){return canvasTex(256,128,(g,w,h)=>{const A=new THREE.Color(p.pl[0]),B=new THREE.Color(p.pl[1]);const im=g.createImageData(w,h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const t=clamp(fbm(y*.06+seed,x*.012+fbm(x*.03,y*.05+seed,3)*1.5,4),0,1);const i=(y*w+x)*4;
    im.data[i]=(A.r+(B.r-A.r)*t)*255;im.data[i+1]=(A.g+(B.g-A.g)*t)*255;im.data[i+2]=(A.b+(B.b-A.b)*t)*255;im.data[i+3]=255}g.putImageData(im,0,0)})}
const ringTex=canvasTex(512,512,(g,w,h)=>{g.lineWidth=1.3;for(let r=256;r>150;r--){const t=r/256;const a=t>.985?0:(.12+.55*Math.abs(Math.sin(t*61))*(.45+.55*Math.sin(t*19)))*(t<.66?(t-.59)/.07:1);if(a<=0)continue;g.strokeStyle=`rgba(225,210,185,${a})`;g.beginPath();g.arc(256,256,r,0,TAU);g.stroke()}});
const planet=new THREE.Group();const plMat=new THREE.MeshStandardMaterial({roughness:1,metalness:0});planet.add(new THREE.Mesh(new THREE.SphereGeometry(1,48,32),plMat));
const atmMat=fresnelMat(0x66ccff,2.2,1.4);planet.add(new THREE.Mesh(new THREE.SphereGeometry(1.05,48,32),atmMat));
const plRing=new THREE.Mesh(new THREE.RingGeometry(1.25,2.1,128),new THREE.MeshBasicMaterial({map:ringTex,transparent:true,side:THREE.DoubleSide,depthWrite:false,opacity:.8}));plRing.rotation.set(1.25,.25,0);planet.add(plRing);
planet.scale.setScalar(13);planet.position.z=-170;planet.rotation.set(.3,0,.25);scene.add(planet);let planetSide=1;
function placePlanet(){const s=(D+170)/D;planet.position.x=planetSide*HW*.8*s;planet.position.y=HH*.66*s}
let curPal=PAL[0];
function setBackdrop(n,dim=1){const p=PAL[(n-1)%PAL.length];curPal=p;if(nebMat.map)nebMat.map.dispose();nebMat.map=nebulaTex(p,n*3.7);nebMat.color.setScalar(dim);nebMat.needsUpdate=true;
  if(plMat.map)plMat.map.dispose();plMat.map=planetTex(p,n*1.3);plMat.needsUpdate=true;plRing.visible=p.ring;atmMat.uniforms.col.value.set(p.light);planetSide=n%2?1:-1;placePlanet();
  rim.color.set(p.light);hemi.color.set(p.hemi)}

// ---------- particles / fx ----------
const P=pointCloud(2200);scene.add(P.pts);const pv=new Float32Array(P.n*3),pl=new Float32Array(P.n),pm=new Float32Array(P.n),pd=new Float32Array(P.n),ps=new Float32Array(P.n);let ph=0;
function emit(x,y,z,vx,vy,vz,life,size,r,g,b,drag=1.6){const i=ph;ph=(ph+1)%P.n;P.pos[i*3]=x;P.pos[i*3+1]=y;P.pos[i*3+2]=z;pv[i*3]=vx;pv[i*3+1]=vy;pv[i*3+2]=vz;pl[i]=pm[i]=life;ps[i]=size;pd[i]=drag;P.col[i*3]=r;P.col[i*3+1]=g;P.col[i*3+2]=b;P.alpha[i]=1;P.size[i]=size}
function burst(x,y,n,spd,life,size,c,spread=1){for(let i=0;i<n;i++){const a=rand(0,TAU),s=spd*rand(.25,1),cc=Array.isArray(c[0])?pick(c):c;emit(x,y,rand(-.5,.5),Math.cos(a)*s,Math.sin(a)*s,rand(-2,2)*spread,life*rand(.5,1),size*rand(.6,1.3),cc[0],cc[1],cc[2])}}
function updParticles(dt){for(let i=0;i<P.n;i++){if(pl[i]<=0){if(P.alpha[i]){P.alpha[i]=0}continue}pl[i]-=dt;const t=Math.max(0,pl[i]/pm[i]);const k=Math.exp(-pd[i]*dt);
  pv[i*3]*=k;pv[i*3+1]*=k;pv[i*3+2]*=k;P.pos[i*3]+=pv[i*3]*dt;P.pos[i*3+1]+=pv[i*3+1]*dt;P.pos[i*3+2]+=pv[i*3+2]*dt;P.alpha[i]=t;P.size[i]=ps[i]*(.35+.65*t)}P.dirty()}
const ringGeo=new THREE.RingGeometry(.9,1,72),shocks=[];
function shock(x,y,radius,col,dur=.5){const m=new THREE.Mesh(ringGeo,new THREE.MeshBasicMaterial({color:new THREE.Color(...col),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));m.position.set(x,y,.6);scene.add(m);shocks.push({m,t:0,dur,radius})}
const glowTex=softTex(),flashes=[];
function flash(x,y,size,col,dur=.35){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:new THREE.Color(...col),blending:THREE.AdditiveBlending,depthWrite:false,transparent:true}));s.position.set(x,y,1);s.scale.setScalar(size);scene.add(s);flashes.push({s,t:0,dur,size})}

let lastHud='';

function rockType(n){const w=[['rock',5]];if(n>=2)w.push(['crystal',1.5]);if(n>=3)w.push(['ice',1.6]);if(n>=4)w.push(['magma',1.4]);if(n>=6)w.push(['iron',1.3]);
  let t=Math.random()*w.reduce((s,x)=>s+x[1],0);for(const[k,v]of w){t-=v;if(t<0)return k}return'rock'}

  const a=rand(0,TAU),s=rockSpeed(0);makeRock(type,0,x,y,Math.cos(a)*s,Math.sin(a)*s)}

$('muteB').onclick=()=>{muted=!muted;store.set('mute',muted);$('muteB').textContent=muted?'🔇':'🔊';setThrust(false)};$('muteB').textContent=muted?'🔇':'🔊';

function warp(){if(state!=='play'||!ship.alive||warpCD>0)return;const ox=ship.x,oy=ship.y;let bx=rand(-HW*.85,HW*.85),by=rand(-HH*.8,HH*.8);
  if(up.warp){let bs=-1;for(let i=0;i<16;i++){const x=rand(-HW*.85,HW*.85),y=rand(-HH*.75,HH*.75);let m=99;for(const o of rocks)m=Math.min(m,Math.hypot(o.x-x,o.y-y)-o.r);if(bh.on)m=Math.min(m,Math.hypot(bh.x-x,bh.y-y)-4);if(boss)m=Math.min(m,Math.hypot(boss.x-x,boss.y-y)-boss.r);if(m>bs){bs=m;bx=x;by=y}}}
  for(let i=0;i<30;i++){const a=rand(0,TAU);emit(ox+Math.cos(a)*3,oy+Math.sin(a)*3,0,-Math.cos(a)*8,-Math.sin(a)*8,0,.4,.8,2,1.5,5)}
  ship.x=bx;ship.y=by;ship.vx*=.3;ship.vy*=.3;ship.inv=Math.max(ship.inv,.6);warpCD=up.warp?4:8;S.warp();shock(bx,by,4,[2,1.4,5],.4);flash(bx,by,6,[2,1.5,5],.35)}
function fireNova(){if(state!=='play'||!ship.alive||nova<1)return;nova=0;const R=10+4*(up.novac||0);S.nova();vibrate(50);shake=1.4;
  shock(ship.x,ship.y,R,[5,2.6,.6],.7);shock(ship.x,ship.y,R*.7,[1,3,6],.55);flash(ship.x,ship.y,R*1.6,[4,2.4,1],.5);burst(ship.x,ship.y,120,R*2.2,.7,1.2,[[5,2.6,.6],[1,3,6],[4,4,4]]);
  for(const o of [...rocks]){const d=Math.hypot(o.x-ship.x,o.y-ship.y);if(d<R+o.r){if(!pend.some(p=>p.o===o))pend.push({o,t:d*.02,dmg:o.size===0?3:9})}}
  for(const r of raiders)if(Math.hypot(r.x-ship.x,r.y-ship.y)<R)r.hp=0;for(const m of meteors)if(Math.hypot(m.x-ship.x,m.y-ship.y)<R)m.dead=true;
  for(let i=ebullets.length-1;i>=0;i--){const e=ebullets[i];if(Math.hypot(e.x-ship.x,e.y-ship.y)<R){scene.remove(e.m);ebullets.splice(i,1)}}
  if(boss&&Math.hypot(boss.x-ship.x,boss.y-ship.y)<R+boss.r)damageBoss(14,boss.x,boss.y);ship.inv=Math.max(ship.inv,.8)}

function fire(){const ca=Math.cos(ship.a),sa=Math.sin(ship.a),px=-sa,py=ca,sp=34,lv=up.twin||0;const shots=[];
  if(lv===0)shots.push([0,0]);else{shots.push([-.32,0],[.32,0]);if(lv>=2)shots.push([0,.2],[0,-.2])}
  for(const[off,da]of shots){const a=ship.a+da,m=bPool.pop()||new THREE.Mesh(bulletGeo,bulletMat);const x=ship.x+ca*1.4+px*off,y=ship.y+sa*1.4+py*off;m.position.set(x,y,0);m.rotation.set(0,0,a-Math.PI/2);scene.add(m);
    bullets.push({m,x,y,vx:Math.cos(a)*sp+ship.vx*.5,vy:Math.sin(a)*sp+ship.vy*.5,life:.78,pierce:[0,1,3][up.pierce||0],hit:[]})}S.pew()}
function launchMissile(){let t=null,bd=1e9;for(const o of rocks){const d=Math.hypot(o.x-ship.x,o.y-ship.y);if(d<bd){bd=d;t=o}}for(const r of raiders){const d=Math.hypot(r.x-ship.x,r.y-ship.y)*.6;if(d<bd){bd=d;t=r}}if(boss&&!t)t=boss;if(!t)return;
  const m=new THREE.Mesh(misGeo,misMat);scene.add(m);const a=ship.a+pick([-1,1])*1.4;missiles.push({m,x:ship.x,y:ship.y,vx:Math.cos(a)*10+ship.vx,vy:Math.sin(a)*10+ship.vy,t,life:3.5});S.missile()}

// ---------- update ----------
function wrap(o,r){const W=HW+r,H=HH+r;if(o.x>W)o.x-=2*W;else if(o.x<-W)o.x+=2*W;if(o.y>H)o.y-=2*H;else if(o.y<-H)o.y+=2*H}
function pull(o,G,dt){if(!bh.on)return;const dx=bh.x-o.x,dy=bh.y-o.y,d=Math.max(1.2,Math.hypot(dx,dy)),f=G/Math.pow(d,1.35);o.vx+=dx/d*f*dt;o.vy+=dy/d*f*dt}
function update(dt){time+=dt;
  // ship
  const eng=up.engine||0,acc=22*(1+.25*eng),maxV=17*(1+.18*eng),turn=10*(1+.2*eng);let thr=false,turnRate=0;
  if(ship.alive){if(touch.on)touch.t+=dt;
    if(keys.ArrowLeft||keys.KeyA){turnRate=4.8*(1+.2*eng);touch.aim=false}if(keys.ArrowRight||keys.KeyD){turnRate=-4.8*(1+.2*eng);touch.aim=false}if(keys.ArrowUp||keys.KeyW)thr=true;
    if(touch.aim){const dx=touch.x-ship.x,dy=touch.y-ship.y,dist=Math.hypot(dx,dy);const d=angDiff(ship.a,Math.atan2(dy,dx));const st=clamp(d,-turn*dt,turn*dt);turnRate=st/dt;
      if(touch.on&&touch.t>.13&&dist>2.2)thr=true;if(!touch.on&&Math.abs(d)<.03)touch.aim=false}
    ship.a+=turnRate*dt;
    if(thr){ship.vx+=Math.cos(ship.a)*acc*dt;ship.vy+=Math.sin(ship.a)*acc*dt;if(Math.random()<.9){const bx=ship.x-Math.cos(ship.a)*1.3,by=ship.y-Math.sin(ship.a)*1.3;emit(bx,by,0,-Math.cos(ship.a)*9+ship.vx+rand(-1.5,1.5),-Math.sin(ship.a)*9+ship.vy+rand(-1.5,1.5),0,.38,.75,1.2,3,5,2.5)}}
    ship.vx+=windX*.9*dt;ship.vy+=windY*.9*dt;pull(ship,55,dt);
    const k=Math.exp(-.55*dt);ship.vx*=k;ship.vy*=k;const v=Math.hypot(ship.vx,ship.vy);if(v>maxV){ship.vx*=maxV/v;ship.vy*=maxV/v}
    ship.x+=ship.vx*dt;ship.y+=ship.vy*dt;wrap(ship,.8);ship.inv=Math.max(0,ship.inv-dt);
    ship.fireT-=dt;if(ship.fireT<=0){fire();ship.fireT=.21*Math.pow(.78,up.rapid||0)}
    if(up.missile){ship.misT-=dt;if(ship.misT<=0){launchMissile();ship.misT=[0,2.4,1.6,1.1][up.missile]}}
    if(up.shield&&!ship.shieldUp){ship.shieldT+=dt;if(ship.shieldT>=(up.shield>1?11:22)){ship.shieldUp=true;S.shield()}}
    if(bh.on&&Math.hypot(bh.x-ship.x,bh.y-ship.y)<bh.R+.4){ship.inv=0;ship.shieldUp=false;hurtShip()}
  }else if(lives>0){ship.respawnT-=dt;if(ship.respawnT<=0){let safe=true;for(const o of rocks)if(Math.hypot(o.x,o.y)<o.r+5.5)safe=false;if(boss&&Math.hypot(boss.x,boss.y)<boss.r+5)safe=false;if(safe||ship.respawnT<-3)resetShip()}}
  setThrust(thr&&ship.alive);ship.thrust+=((thr?1:0)-ship.thrust)*Math.min(1,dt*14);ship.roll+=(clamp(-turnRate*.11,-.7,.7)-ship.roll)*Math.min(1,dt*6);
  warpCD=Math.max(0,warpCD-dt);if(comboT>0){comboT-=dt;if(comboT<=0){combo=0;hud()}}
  // bullets
  for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];pull(b,90,dt);b.x+=b.vx*dt;b.y+=b.vy*dt;wrap(b,.3);b.life-=dt;let dead=b.life<=0;
    if(!dead)for(const o of rocks){if(b.hit.includes(o))continue;if(Math.hypot(o.x-b.x,o.y-b.y)<o.r*.95+.2){hitRock(o,1,'gun',b.x,b.y);if(b.pierce>0){b.pierce--;b.hit.push(o)}else{dead=true;break}}}
    if(!dead)for(const r of raiders)if(Math.hypot(r.x-b.x,r.y-b.y)<r.r+.2){r.hp--;r.flash=1;dead=true;break}
    if(!dead)for(const m of meteors)if(Math.hypot(m.x-b.x,m.y-b.y)<m.r+.3){m.dead=true;m.shot=true;dead=true;break}
    if(!dead&&boss&&!boss.enter&&Math.hypot(boss.x-b.x,boss.y-b.y)<boss.r*.95){damageBoss(1,b.x,b.y);dead=true}
    if(bh.on&&Math.hypot(bh.x-b.x,bh.y-b.y)<bh.R)dead=true;
    if(dead){scene.remove(b.m);bPool.push(b.m);bullets.splice(i,1)}else{b.m.position.set(b.x,b.y,0);b.m.rotation.z=Math.atan2(b.vy,b.vx)-Math.PI/2}}
  // rocks
  for(const o of [...rocks]){if(bh.on){pull(o,22/(o.size===0?2:1),dt);const v=Math.hypot(o.vx,o.vy),mx=12;if(v>mx){o.vx*=mx/v;o.vy*=mx/v}
      if(Math.hypot(bh.x-o.x,bh.y-o.y)<bh.R+o.r*.35){removeRock(o);burst(o.x,o.y,30,6,.8,1,[[4,1.7,.5],[1.4,.4,2.6]]);const p=Math.round(200*comboMul()*MODS[mod].m);addScore(p);popup(o.x,o.y,'Swallowed! +'+p,'#d8a0ff');S.boom(2);continue}}
    o.x+=(o.vx+windX)*dt;o.y+=(o.vy+windY)*dt;wrap(o,o.r);o.g.position.set(o.x,o.y,0);o.g.rotateOnAxis(o.ax,o.spin*dt);
    if(o.flash>0){o.flash=Math.max(0,o.flash-dt*4);if(o.type==='iron')o.mat.emissiveIntensity=o.flash*1.5+(1-o.hp/TYPE.iron.hp[o.size])*.5}
    if(o.type==='magma'&&Math.random()<dt*6)emit(o.x+rand(-.5,.5)*o.r,o.y+rand(-.5,.5)*o.r,o.r*.5,rand(-1,1),rand(-1,1),2,.6,.5*o.r,4,1.4,.2);
    if(shipHit(o.x,o.y,o.r*.82)){hurtShip();if(!ship.alive)hitRock(o,1,'crash')}}
  for(let i=pend.length-1;i>=0;i--){const p=pend[i];p.t-=dt;if(p.t<=0){pend.splice(i,1);if(rocks.includes(p.o))hitRock(p.o,p.dmg||3,'blast')}}
  // meteors (shower)
  if(mod==='shower'){meteorT-=dt;if(meteorT<=0){meteorT=rand(.6,1.3);const a=showerA+rand(-.3,.3),R=Math.hypot(HW,HH)+2,off=rand(-1,1)*Math.max(HW,HH),px=-Math.sin(a),py=Math.cos(a);
    const g=new THREE.Mesh(pick(GEO.meteor),MAT.meteor);g.scale.setScalar(.75);scene.add(g);const sp=rand(13,19);meteors.push({g,x:-Math.cos(a)*R+px*off,y:-Math.sin(a)*R+py*off,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:.75,life:6})}}
  for(let i=meteors.length-1;i>=0;i--){const m=meteors[i];m.x+=m.vx*dt;m.y+=m.vy*dt;m.life-=dt;m.g.position.set(m.x,m.y,0);m.g.rotation.x+=dt*4;m.g.rotation.y+=dt*3;
    for(let k=0;k<2;k++)emit(m.x+rand(-.3,.3),m.y+rand(-.3,.3),0,-m.vx*.15+rand(-1,1),-m.vy*.15+rand(-1,1),0,.45,1.1,4,1.5,.3,1);
    if(shipHit(m.x,m.y,m.r)){hurtShip();m.dead=true}
    if(m.dead||m.life<=0){scene.remove(m.g);meteors.splice(i,1);if(m.dead){burst(m.x,m.y,22,9,.5,.8,[[4,1.5,.3],[4,3,1]]);S.boom(2);if(m.shot)addKill(m.x,m.y,150,.8)}}}
  // ion storm flashes
  if(mod==='ion'){ionT-=dt;if(ionT<=0){ionT=rand(2.5,5.5);flashL=1;S.zap()}}flashL=Math.max(0,flashL-dt*3);hemi.intensity=(mod==='dark'?.06:.9)+flashL*2.5;
  // wind streaks
  if(windX||windY){if(Math.random()<dt*40){const x=rand(-HW,HW),y=rand(-HH,HH);emit(x,y,-2,windX*6,windY*6,0,.7,.35,.5,.6,.8,0)}}
  // black hole
  if(bh.on){bh.disk.material.uniforms.time.value=time;bh.g.rotation.z+=dt*.2;if(Math.random()<dt*25){const a=rand(0,TAU),r=rand(5,7);emit(bh.x+Math.cos(a)*r,bh.y+Math.sin(a)*r,0,-Math.cos(a)*5-Math.sin(a)*6,-Math.sin(a)*5+Math.cos(a)*6,0,.9,.6,2,.9,2.4,0)}}
  // raiders
  if(sector>=2&&!boss){raiderT-=dt;if(raiderT<=0){raiderT=rand(18,30);spawnRaider()}}
  for(const r of [...raiders]){r.t+=dt;r.x+=r.vx*dt;r.y=r.by+Math.sin(r.t*1.6)*3;r.g.position.set(r.x,r.y,0);r.g.rotation.z+=dt*2;r.flash=Math.max(0,r.flash-dt*4);rdBodyMat.emissive.setRGB(r.flash,0,0);
    if(r.hp<=0){killRaider(r);continue}if(Math.abs(r.x)>HW+3&&r.t>2){scene.remove(r.g);raiders.splice(raiders.indexOf(r),1);continue}
    r.fireT-=dt;if(r.fireT<=0&&ship.alive&&Math.abs(r.x)<HW){r.fireT=rand(1.3,1.9);const a=Math.atan2(ship.y-r.y,ship.x-r.x)+rand(-.28,.28);shootE(r.x,r.y,a,11,eMat);S.zap()}
    if(shipHit(r.x,r.y,r.r*.9)){hurtShip();r.hp=0}
    for(const o of rocks)if(Math.hypot(o.x-r.x,o.y-r.y)<o.r+r.r*.8){r.hp=0;hitRock(o,1,'crash');break}}
  // boss
  if(boss){const b=boss;b.rot+=dt*.25;b.g.rotation.set(b.rot*.7,b.rot,b.rot*.3);b.flash=Math.max(0,b.flash-dt*5);b.shell.material.emissiveIntensity=.3+b.flash*1.2+.15*Math.sin(time*3);
    if(b.dying){b.dying-=dt;b.x+=rand(-.1,.1);if(Math.random()<dt*14){const a=rand(0,TAU),r=rand(0,b.r);burst(b.x+Math.cos(a)*r,b.y+Math.sin(a)*r,20,10,.6,1,[[5,1.6,.3],[5,3,.8]]);flash(b.x+Math.cos(a)*r,b.y+Math.sin(a)*r,5,[5,2,.5],.3);S.boom(1);shake=Math.max(shake,.7)}b.g.position.set(b.x,b.y,0);if(b.dying<=0)finishBoss()}
    else{b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.enter){if(b.y<HH*.3){b.enter=false;b.vy=-rand(1.2,2)}}else{const lx=HW-b.r*.8,ly=HH-b.r*1.05;if(Math.abs(b.x)>lx){b.vx=-Math.sign(b.x)*Math.abs(b.vx);b.x=Math.sign(b.x)*lx}if(Math.abs(b.y)>ly){b.vy=-Math.sign(b.y)*Math.abs(b.vy);b.y=Math.sign(b.y)*ly}}
      b.g.position.set(b.x,b.y,0);
      if(!b.enter){b.shotT-=dt;if(b.shotT<=0){const hard=b.hp<b.max*.5;b.shotT=hard?2.4:3.4;const n=hard?14:10;b.vol+=.3;for(let i=0;i<n;i++){const a=b.vol+i/n*TAU;shootE(b.x+Math.cos(a)*b.r,b.y+Math.sin(a)*b.r,a,hard?9.5:8,eFireMat)}S.zap();flash(b.x,b.y,b.r*3,[5,1.6,.3],.3)}
        b.spawnT-=dt;if(b.spawnT<=0&&rocks.length<14){b.spawnT=6;for(let k=0;k<2;k++){const a=rand(0,TAU);makeRock(pick(['rock','magma']),1,b.x+Math.cos(a)*b.r,b.y+Math.sin(a)*b.r,Math.cos(a)*5,Math.sin(a)*5)}}}
      if(shipHit(b.x,b.y,b.r*.85))hurtShip()}}
  // enemy shots
  for(let i=ebullets.length-1;i>=0;i--){const e=ebullets[i];e.x+=e.vx*dt;e.y+=e.vy*dt;e.life-=dt;e.m.position.set(e.x,e.y,0);let dead=e.life<=0||Math.abs(e.x)>HW+2||Math.abs(e.y)>HH+2;
    if(!dead&&shipHit(e.x,e.y,.2)){hurtShip();dead=true}for(const d of drones)if(!dead&&Math.hypot(d.x-e.x,d.y-e.y)<.7){dead=true;burst(e.x,e.y,8,5,.3,.6,[1,4,2])}
    if(dead){scene.remove(e.m);ebullets.splice(i,1)}}
  // missiles
  for(let i=missiles.length-1;i>=0;i--){const m=missiles[i];m.life-=dt;let t=m.t;const alive=t&&(t===boss?!!boss:(rocks.includes(t)||raiders.includes(t)));
    if(!alive){let bd=1e9;t=null;for(const o of rocks){const d=Math.hypot(o.x-m.x,o.y-m.y);if(d<bd){bd=d;t=o}}if(!t&&boss)t=boss;m.t=t}
    const sp=Math.min(24,Math.hypot(m.vx,m.vy)+dt*30);let a=Math.atan2(m.vy,m.vx);if(t)a+=clamp(angDiff(a,Math.atan2(t.y-m.y,t.x-m.x)),-5*dt,5*dt);m.vx=Math.cos(a)*sp;m.vy=Math.sin(a)*sp;m.x+=m.vx*dt;m.y+=m.vy*dt;wrap(m,.5);
    m.m.position.set(m.x,m.y,0);m.m.rotation.z=a-Math.PI/2;emit(m.x-Math.cos(a)*.4,m.y-Math.sin(a)*.4,0,rand(-1,1),rand(-1,1),0,.4,.6,4,2,.5,2);
    let hit=false;if(t&&Math.hypot(t.x-m.x,t.y-m.y)<(t.r||1)*.9+.3){hit=true;if(t===boss)damageBoss(2,m.x,m.y);else if(raiders.includes(t)){t.hp-=2;t.flash=1}else hitRock(t,2,'missile',m.x,m.y)}
    if(hit||m.life<=0){scene.remove(m.m);missiles.splice(i,1);burst(m.x,m.y,14,7,.35,.8,[[5,2.5,.6],[4,4,4]])}}
  // drones
  const nd=drones.length;for(let i=0;i<nd;i++){const d=drones[i],a=time*2.6+i/nd*TAU;d.x=ship.x+Math.cos(a)*2.8;d.y=ship.y+Math.sin(a)*2.8;d.m.position.set(d.x,d.y,.2);d.m.visible=ship.alive;d.cd-=dt;
    if(ship.alive&&d.cd<=0)for(const o of rocks)if(Math.hypot(o.x-d.x,o.y-d.y)<o.r+.35){d.cd=.35;if(o.size===2)killRock(o,'drone');else hitRock(o,1,'drone',d.x,d.y);break}
    if(ship.alive&&Math.random()<dt*20)emit(d.x,d.y,0,0,0,0,.25,.4,.6,3,1.6,0)}
  // gems
  const magR=[4,9,15][up.magnet||0];
  for(let i=gems.length-1;i>=0;i--){const g=gems[i];g.life-=dt;const dx=ship.x-g.x,dy=ship.y-g.y,d=Math.hypot(dx,dy);
    if(ship.alive&&d<magR){const f=40*(1-d/magR)+10;g.vx+=dx/d*f*dt;g.vy+=dy/d*f*dt}pull(g,30,dt);const k=Math.exp(-1.2*dt);g.vx*=k;g.vy*=k;g.x+=g.vx*dt;g.y+=g.vy*dt;wrap(g,.4);
    g.m.position.set(g.x,g.y,0);g.m.rotation.y+=dt*3;g.m.rotation.x+=dt*1.3;g.m.visible=g.life>3||Math.sin(g.life*20)>0;
    let gone=g.life<=0||(bh.on&&Math.hypot(bh.x-g.x,bh.y-g.y)<bh.R);
    if(ship.alive&&d<1.4){gone=true;const p=Math.round(25*MODS[mod].m);addScore(p);popup(g.x,g.y,'+'+p,'#7dffc8');S.gem();nova=Math.min(1,nova+.06*(1+.5*(up.novac||0)));burst(g.x,g.y,10,5,.35,.6,[.4,3,1.6])}
    if(gone){scene.remove(g.m);gems.splice(i,1)}}
  // game over / sector clear
  if(lives<=0&&!ship.alive){overT-=dt;if(overT<=0)gameOver()}
  else if(!rocks.length&&!boss&&!pend.length&&state==='play'){clearT+=dt;if(clearT>1.3)sectorClear()}else clearT=0;
  // UI meters
  $('bNova').style.setProperty('--p',nova);$('bNova').classList.toggle('ready',nova>=1);$('bWarp').style.setProperty('--p',1-warpCD/(up.warp?4:8));$('bWarp').classList.toggle('ready',warpCD<=0);
}
function shootE(x,y,a,sp,mat){const m=new THREE.Mesh(eGeo,mat);m.position.set(x,y,0);scene.add(m);ebullets.push({m,x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:5})}

// ---------- visuals each frame ----------
function visuals(dt){
  ship.g.position.set(ship.x,ship.y,0);ship.body.rotation.z=ship.a-Math.PI/2;ship.body.rotation.y=ship.roll;
  for(const f of ship.flames){f.scale.set(1,.15+ship.thrust*(1.1+Math.random()*.5),1);f.visible=ship.thrust>.05}
  ship.light.intensity=ship.thrust*6;
  const sm=ship.shell.material.uniforms;if(ship.inv>0){sm.col.value.setRGB(2.5,2.8,3.2);sm.op.value=.45+.35*Math.sin(time*18)}else if(ship.shieldUp){sm.col.value.setRGB(.4,2.6,3.6);sm.op.value=.55+.15*Math.sin(time*4)}else sm.op.value=0;
  ship.spot.target.position.set(Math.cos(ship.a)*12,Math.sin(ship.a)*12,0);
  // stars parallax + twinkle
  const vx=ship.alive?ship.vx:0,vy=ship.alive?ship.vy:0;
  for(let i=0;i<stars.n;i++){const z=starZ[i],s=(D-z)/D,k=.06*D/(D-z);let x=stars.pos[i*3]-(vx+windX)*k*dt,y=stars.pos[i*3+1]-(vy+windY)*k*dt;const W=HW*s,H=HH*s;if(x>W)x-=2*W;else if(x<-W)x+=2*W;if(y>H)y-=2*H;else if(y<-H)y+=2*H;
    stars.pos[i*3]=x;stars.pos[i*3+1]=y;stars.alpha[i]=starB[i]*(.7+.3*Math.sin(time*2+starPh[i]))*(mod==='dark'?.5:1)}stars.dirty();
  planet.children[0].rotation.y+=dt*.03;
  shake=Math.max(0,shake-dt*3);camera.position.x=(Math.random()-.5)*shake*.6;camera.position.y=(Math.random()-.5)*shake*.6;
  ptMat.uniforms.scale.value=innerHeight*renderer.getPixelRatio()/2/Math.tan(THREE.MathUtils.degToRad(FOV/2));
  updFx(dt);updPops(dt)}

// ---------- screens ----------
const ov=$('ov'),panel=$('panel');
function show(html,wide=false){panel.innerHTML=html;panel.classList.toggle('wide',wide);ov.classList.remove('hidden')}
function hide(){ov.classList.add('hidden')}
function menu(){state='menu';show(`<h2>ROCK <span>STORM</span></h2>
  <p>Blast your way through the asteroid belt, one sector at a time.</p>
  <p>👆 <b>Tap</b> to aim. <b>Hold</b> to fly toward your finger. Your cannons fire on their own.</p>
  <p>🌀 <b>Warp</b> jumps you across space. 💥 <b>Nova</b> fills up as you blast rocks and grab 💚 gems.</p>
  <p>🪨 New rocks show up as you go: 💎 crystal (gems inside), 🧊 ice (shatters into 3), 🔥 magma (explodes!) and 🔩 iron (tough).</p>
  <p>🌌 Every sector changes the rules: meteor showers, black holes, ion storms, the dark… plus a giant boss every 5th sector. Pick a ship upgrade after each one.</p>
  <button class="main" id="go">Launch 🚀</button><p class="sub">Best score: ${best.toLocaleString()} · Keyboard: arrows, X warp, Z nova</p>`);$('go').onclick=()=>{hide();newGame()}}
function sectorClear(){state='upgrade';setThrust(false);S.clear();const bonus=500*sector,flawless=sectorDeaths===0?1000:0;addScore(bonus+flawless);
  const avail=UPS.filter(u=>(up[u.id]||0)<u.max);const ch=[];while(ch.length<3&&avail.length)ch.push(avail.splice(Math.floor(Math.random()*avail.length),1)[0]);
  show(`<h2>Sector ${sector} <span>clear!</span></h2><div class="stats">Sector bonus <b>+${bonus.toLocaleString()}</b>${flawless?`<br>Flawless (no ships lost) <b>+1,000</b>`:''}</div><p>Choose an upgrade:</p>
    <div class="cards">${ch.map((u,i)=>{const l=up[u.id]||0;return`<button class="card" data-i="${i}"><div class="ic">${u.ic}</div><div><b>${u.name}</b><span>${u.d(l)}</span>${u.max>1&&u.max<99?`<i>LEVEL ${l+1} / ${u.max}</i>`:''}</div></button>`}).join('')}</div>`,true);
  panel.querySelectorAll('.card').forEach(b=>b.onclick=()=>{const u=ch[+b.dataset.i];up[u.id]=(up[u.id]||0)+1;if(u.id==='life')lives++;if(u.id==='drone')setDrones(up.drone);if(u.id==='shield'){ship.shieldUp=true}S.pick();hide();
    for(const g of gems)scene.remove(g.m);gems=[];touch.on=false;touch.aim=false;ship.inv=Math.max(ship.inv,1.5);startSector(sector+1)})}
function gameOver(){state='over';setThrust(false);const keep=rocks;rocks=[];clearWorld();rocks=keep;setDrones(0);const nb=score>best;if(nb){best=score;store.set('best',best)}$('best').textContent='Best '+best.toLocaleString();$('ctrl').classList.add('hidden');$('modchip').classList.add('hidden');
  show(`<h2>Game <span>Over</span></h2><div class="stats">Score <b>${score.toLocaleString()}</b><br>Reached sector <b>${sector}</b> · Rocks blasted <b>${kills}</b></div><p>${nb?'🔥 New high score!':'Best: '+best.toLocaleString()}</p>
    <button class="main" id="again">Play again 🚀</button><br><a class="alt" href="https://jonniejett.github.io/">← Back to the Game Room</a>`);$('again').onclick=()=>{hide();newGame()}}
let prevState='play';
function pause(){if(state!=='play')return;state='paused';setThrust(false);touch.on=false;show(`<h2>Paused</h2><p>Sector ${sector} · ${score.toLocaleString()} points</p><button class="main" id="res">Resume ▶</button><br><a class="alt" href="https://jonniejett.github.io/">← Back to the Game Room</a>`);$('res').onclick=resume}
function resume(){hide();state='play';audio()}

// ---------- attract mode + loop ----------
fit();addEventListener('resize',fit);setBackdrop(1);$('best').textContent='Best '+best.toLocaleString();
for(let i=0;i<7;i++){const a=rand(0,TAU),s=rand(1.5,3);makeRock(pick(['rock','rock','crystal','ice','magma','iron']),pick([0,0,1,2]),rand(-HW,HW),rand(-HH,HH),Math.cos(a)*s,Math.sin(a)*s)}
function attract(dt){for(const o of rocks){o.x+=o.vx*dt;o.y+=o.vy*dt;wrap(o,o.r);o.g.position.set(o.x,o.y,0);o.g.rotateOnAxis(o.ax,o.spin*dt);if(o.type==='magma'&&Math.random()<dt*6)emit(o.x,o.y,o.r*.5,rand(-1,1),rand(-1,1),2,.6,.5*o.r,4,1.4,.2)}}
let last=performance.now();
function loop(now){requestAnimationFrame(loop);let dt=Math.min(.05,(now-last)/1000);last=now;
  if(state==='play')update(dt);else if(state==='menu'||state==='over'){time+=dt;attract(dt)}
  visuals(state==='paused'?0:dt);render(dt)}
$('loading').remove();menu();requestAnimationFrame(loop);

window.__rs={get state(){return state},get rocks(){return rocks},ship,up,get boss(){return boss},startSector:n=>{clearWorld();if(!ship.alive)resetShip();hide();$('ctrl').classList.remove('hidden');startSector(n)},
  killAll:()=>{for(const o of [...rocks])killRock(o,'gun')},setUp:(k,v)=>{up[k]=v;if(k==='drone')setDrones(v)},clearNow:()=>{clearWorld()},newGame:()=>{hide();newGame()},setNova:v=>nova=v,touchAt:(x,y,on)=>{touch.on=on;touch.aim=true;touch.x=x;touch.y=y;touch.t=on?1:0}};
</script>
