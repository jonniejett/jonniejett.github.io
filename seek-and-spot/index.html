<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Seek and Spot</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: playful, calm, no pressure — a lazy-afternoon puzzle book
   IDEA: a picture-search page from a kids' activity book, framed like a toy
   PICTURE: the hand-drawn scene itself, big, with a checklist of items beside it
   COLOUR and TYPE: sunny yellow ground, coral accent, ink brown; Fredoka throughout
   LAYOUT: title + scene tabs, scene on top, checklist + hint below (side by side when wide) */
:root{color-scheme:light dark;--bg:light-dark(#ffe9a8,#1c1a16);--ink:light-dark(#2b2118,#f7eedb);--panel:light-dark(#fffaf0,#29261f);--line:light-dark(#ecd48a,#3d3829);--acc:#e8553d;--soft:light-dark(#fff2c9,#332f25);--mut:light-dark(#6d5b45,#c7b998)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Fredoka,system-ui,sans-serif;overflow-x:clip;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.top{padding:22px max(4vw,14px) 12px;max-width:1240px;margin:auto}
h1{font-size:clamp(32px,6vw,48px);line-height:1.05;margin:0 0 4px;font-weight:700}
.top p{margin:0 0 14px;color:var(--mut)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:2px solid var(--ink);background:var(--panel);border-radius:999px;padding:8px 16px;min-height:44px;font-weight:600}
.tab[aria-current=true]{background:var(--ink);color:var(--bg)}
.game{display:grid;gap:16px;padding:0 max(4vw,14px) 32px;max-width:1240px;margin:auto}
@media(min-width:680px){.game{grid-template-columns:minmax(0,1fr) 270px;align-items:start}}
/* fit the picture to the screen height (iPhone Duo inner screen is nearly square) */
.stage{max-width:calc((100dvh - 190px)*1.6);min-width:min(100%,300px);margin-inline:auto}
/* short landscape screens (Duo outer screen turned sideways) */
@media(orientation:landscape) and (max-height:520px){.top p{display:none}.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:8px}h1{font-size:26px;margin:0}.game{grid-template-columns:minmax(0,1fr) 240px}.stage{max-width:calc((100dvh - 90px)*1.6)}.tip{display:none}}
/* foldable seam: picture on one screen half, list on the other */
@media(horizontal-viewport-segments:2){.game{grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:calc(env(viewport-segment-left 1 0,0px) - env(viewport-segment-right 0 0,0px) + 24px)}}
@media(vertical-viewport-segments:2){.top p{display:none}.stage{max-width:calc((env(viewport-segment-height 0 0,60dvh) - 110px)*1.6)}.game{grid-template-columns:1fr;row-gap:calc(env(viewport-segment-top 0 1,0px) - env(viewport-segment-bottom 0 0,0px) + 24px)}}
.stage{position:relative;border:4px solid var(--ink);border-radius:18px;overflow:hidden;background:#cfe9f3;box-shadow:0 8px 0 var(--line);aspect-ratio:1000/625}
.stage svg{display:block;width:100%;height:100%;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.stage.zoomed svg{cursor:grab}
.zoom{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
.zoom button{width:44px;height:44px;border-radius:12px;border:2px solid #2b2118;background:#fffaf0;color:#2b2118;font-size:22px;font-weight:700;line-height:1}
.zoom #zreset{width:auto;padding:0 10px;font-size:15px}
.toast{position:absolute;left:50%;top:10px;transform:translate(-50%,-8px);background:#2b2118;color:#fff7e3;padding:6px 14px;border-radius:999px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:16px}
.phead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.phead h2{margin:0;font-size:22px}
.phead span{color:var(--mut);font-weight:500;white-space:nowrap}
.list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media(min-width:680px){.list{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(horizontal-viewport-segments:2){.list{grid-template-columns:repeat(3,minmax(0,1fr))}}
.chip{width:100%;display:flex;align-items:center;gap:6px;padding:6px 8px;min-height:48px;border:2px solid var(--line);border-radius:12px;background:var(--soft);text-align:left;font-size:15px}
.chip svg{width:28px;height:28px;flex:none}
.chip.sel{border-color:var(--acc)}
.chip.done{opacity:.5;text-decoration:line-through}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{flex:1 1 120px;min-height:46px;border-radius:12px;border:2px solid var(--ink);background:transparent;font-weight:600;padding:0 12px}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.hintmsg{min-height:1.5em;margin:12px 0 0;color:var(--ink);font-size:15px}
.tip{margin:10px 0 0;font-size:13px;color:var(--mut)}
.ring{fill:none;stroke:#fff;stroke-width:5;stroke-dasharray:14 10;animation:pulse 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.ring2{fill:rgba(255,255,255,.18);stroke:none}
.mark{fill:none;stroke:var(--acc);stroke-width:5}
.ripple{fill:none;stroke:#fff;stroke-width:3;animation:rip .6s ease-out forwards;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.07);opacity:.7}}
@keyframes rip{from{transform:scale(.3);opacity:1}to{transform:scale(1.4);opacity:0}}
@media(prefers-reduced-motion:reduce){.ring,.ripple{animation:none}.toast{transition:none}}
.win{position:fixed;inset:0;background:rgba(30,22,14,.55);display:grid;place-items:center;padding:16px;z-index:5}
.win[hidden]{display:none}
.card{background:var(--panel);border:4px solid var(--ink);border-radius:20px;padding:24px;max-width:380px;text-align:center}
.card h3{font-size:32px;margin:0 0 6px;line-height:1.1}
.card p{margin:0 0 16px;color:var(--mut)}
</style></head><body>

<symbol id="i-bell" viewBox="-25 -25 50 50"><circle cx="0" cy="-19" r="3.5" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M-17 12Q-14-2-12-8Q-8-16 0-16Q8-16 12-8Q14-2 17 12Z" fill="currentColor" stroke="rgba(0,0,0,.3)" stroke-width="1.5"/><circle cx="0" cy="16" r="4" fill="currentColor" stroke="rgba(0,0,0,.3)"/></symbol>

</defs></svg>

<header class="top">
<h1>Seek &amp; Spot</h1>
<p>Find every item hidden in the picture. No clock, no rush. Stuck? Ask for a hint.</p>
<nav class="tabs" id="tabs" aria-label="Scenes"></nav>
</header>
<main class="game">
<section>
<div class="stage" id="stage">
<svg id="svg" viewBox="0 0 1000 625" role="img" aria-label="Hidden object scene"></svg>
<div class="toast" id="toast" aria-live="polite"></div>
<div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zreset">Fit</button></div>
</div>
</section>
<aside class="panel">
<div class="phead"><h2 id="sname">Scene</h2><span id="count"></span></div>
<ul class="list" id="list"></ul>
<div class="actions"><button class="btn primary" id="hint">Hint</button><button class="btn" id="shuffle">New hiding spots</button></div>
<p class="hintmsg" id="hintmsg" aria-live="polite">Tap an item below to pick it, then tap Hint for help with that one.</p>
<p class="tip">Zoom with + or pinch, then drag to look around.</p>
</aside>
</main>
<div class="win" id="win" hidden><div class="card"><h3>You found them all!</h3><p id="winmsg"></p>
<div class="actions"><button class="btn" id="again">New hiding spots</button><button class="btn primary" id="next">Next scene</button></div></div></div>

<script>
{
const $=id=>document.getElementById(id);
const svg=$('svg'),stage=$('stage');
const NAMES={key:'Key',star:'Star',heart:'Heart',fish:'Fish',cup:'Cup',glasses:'Glasses',umbrella:'Umbrella',bell:'Bell',apple:'Apple',feather:'Feather',crown:'Crown',kite:'Kite'};
const NAT={key:'#c9a43a',star:'#f2c230',heart:'#e0475b',fish:'#3e8fd0',cup:'#f4f4f4',glasses:'#333333',umbrella:'#7a4bd0',bell:'#e0b030',apple:'#d23a2a',feather:'#eeeeee',crown:'#f0b020',kite:'#e85a90'};
const rng=seed=>()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const hx=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,t)=>{const A=hx(a),B=hx(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')};
const C=(x,y,r,f,o='')=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${f}" ${o}/>`;
const R=(x,y,w,h,f,o='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}" ${o}/>`;
const use=(k,x,y,s,c,rot,extra='')=>`<use href="#i-${k}" x="-25" y="-25" width="50" height="50" transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot}) scale(${s})" style="color:${c}" ${extra}/>`;
const pick=(r,a)=>a[Math.floor(r()*a.length)];

function tree(r,x,y,sz){let s=R(x-13,y,26,160,'#7a5432');const g=['#3f8a3a','#4f9a43','#5fae4e','#3a7a35','#68b85a'];
 for(let i=0;i<22;i++){const a=r()*6.28,d=r()*sz*.75;s+=C((x+Math.cos(a)*d).toFixed(1),(y+Math.sin(a)*d*.8).toFixed(1),(sz*.3+r()*sz*.25).toFixed(1),pick(r,g))}return s}
function cloud(x,y){return[[0,0,30],[30,-12,34],[62,0,28],[30,8,30]].map(([a,b,c])=>C(x+a,y+b,c,'#fbfdff')).join('')}

const SC=[
{name:'Sunny park',seed:11,
 draw(r){let s=`<defs><linearGradient id="pk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd0ee"/><stop offset="1" stop-color="#e3f5fb"/></linearGradient></defs>${R(0,0,1000,625,'url(#pk)')}${C(860,95,58,'#ffd45c')}`;
  s+=cloud(190,95)+cloud(450,70)+cloud(640,140);
  s+=`<path d="M0 330Q200 250 420 310T820 290T1000 300V625H0Z" fill="#9ccf86"/><path d="M0 400Q250 340 500 390T1000 380V625H0Z" fill="#74b463"/>`;

  s+=`<ellipse cx="280" cy="500" rx="160" ry="55" fill="#5aa7c9"/><ellipse cx="260" cy="492" rx="90" ry="22" fill="none" stroke="#8cc8e2" stroke-width="3"/><ellipse cx="320" cy="512" rx="50" ry="12" fill="none" stroke="#8cc8e2" stroke-width="3"/>`;
  s+=tree(r,160,250,95)+tree(r,520,205,105)+tree(r,800,300,75);
  s+=`${R(600,452,135,13,'#a0683a')}${R(600,418,135,11,'#a0683a')}${R(610,465,8,30,'#6d4526')}${R(717,465,8,30,'#6d4526')}${R(610,418,6,40,'#6d4526')}${R(719,418,6,40,'#6d4526')}`;
  for(let i=0;i<14;i++)s+=C((830+r()*170).toFixed(0),(520+r()*90).toFixed(0),(22+r()*20).toFixed(0),pick(r,['#4f9a43','#5fae4e','#3f8a3a']));
  for(let i=0;i<90;i++){const x=r()*1000,y=420+r()*200;if(((x-280)/170)**2+((y-500)/62)**2<1)continue;s+=C(x.toFixed(0),y.toFixed(0),(3+r()*4).toFixed(1),pick(r,['#ffd84d','#ff9fb6','#ffffff','#c49bf0','#ff7a6b']))}
  return s},

 items:[['key',520,190,.85,'#3f7f3a','Up in the tallest tree, in the middle.'],['star',720,565,.65,'#f3d24a','Down among the flowers, bottom right.'],['fish',330,505,.8,'#4b93b6','Swimming in the pond.'],['cup',652,438,.6,'#a8743f','Someone left it on the bench.'],['feather',235,92,.85,'#f4f8fb','Floating in a cloud, top left.'],['apple',150,262,.8,'#4f8f3f','In the tree on the left.'],['umbrella',900,555,.85,'#56994a','Tucked into the bushes, bottom right.'],['bell',842,140,.55,'#f2c64a','Hanging just under the sun.'],['glasses',448,590,.7,'#d9c690','Dropped on the path.']]},
{name:'Cozy kitchen',seed:23,
 draw(r){let s=`<defs><pattern id="tl" width="50" height="50" patternUnits="userSpaceOnUse">${R(0,0,50,50,'#f3dcb6')}<path d="M0 0H50M0 0V50" stroke="#e3c79b" stroke-width="2"/></pattern><pattern id="ck" width="30" height="30" patternUnits="userSpaceOnUse">${R(0,0,30,30,'#d9534f')}${R(0,0,15,15,'#f2ece4','opacity=".5"')}${R(15,15,15,15,'#f2ece4','opacity=".5"')}</pattern></defs>`;
  s+=R(0,0,1000,520,'url(#tl)')+R(0,520,1000,105,'#b9825a');

  s+=R(100,60,240,200,'#9fd3ea','stroke="#fffaf0" stroke-width="12"')+`<path d="M220 60V260M100 160H340" stroke="#fffaf0" stroke-width="8"/>`+R(90,258,260,14,'#8b5e3c');
  s+=R(250,215,40,44,'#c46a3f')+[[-14,-18],[0,-30],[14,-20],[-6,-40],[8,-44]].map(([a,b])=>`<ellipse cx="${270+a}" cy="${215+b}" rx="9" ry="16" fill="#5f9a4f" transform="rotate(${a*2} ${270+a} ${215+b})"/>`).join('');
  [190,320].forEach(y=>{s+=R(470,y,440,12,'#8b5e3c');let x=485;while(x<880){const w=34+r()*18,h=40+r()*35,c=pick(r,['#d98c5f','#e1b552','#8fb36a','#c96a5a','#7fa7c4','#b98cc4']);s+=R(x.toFixed(0),(y-h).toFixed(0),w.toFixed(0),h.toFixed(0),c,'rx="6"')+R((x+4).toFixed(0),(y-h-8).toFixed(0),(w-8).toFixed(0),10,'#7a5a45','rx="2"');x+=w+8}});
  s+=`<path d="M620 40H900" stroke="#6b6f75" stroke-width="5"/>`;[680,760,840].forEach((x,i)=>{s+=`<path d="M${x} 40V62" stroke="#6b6f75" stroke-width="3"/>`+C(x,90,26+i*3,'#9aa0a7')+R(x-4,62,8,6,'#6b6f75')});
  s+=R(160,450,14,70,'#7a4e30')+R(690,450,14,70,'#7a4e30')+R(150,425,560,70,'url(#ck)','rx="6"');
  s+=`<ellipse cx="260" cy="428" rx="48" ry="10" fill="#fffaf0"/><ellipse cx="620" cy="428" rx="40" ry="9" fill="#fffaf0"/>`+R(330,385,60,42,'#4f7fa6','rx="10"')+C(360,382,8,'#3c6a8f');
  for(let i=0;i<10;i++)s+=C((40+r()*920).toFixed(0),(540+r()*80).toFixed(0),(2+r()*3).toFixed(1),'#a7714c');
  return s},
 colorAt:(x,y)=>y>520?'#b9825a':(x>100&&x<340&&y>60&&y<260)?'#9fd3ea':(x>150&&x<710&&y>425&&y<495)?'#d9534f':'#f3dcb6',
 region:(x,y)=>y>520?'floor':(x>100&&x<340&&y>60&&y<260)?'window':(x>150&&x<710&&y>425&&y<495)?'tablecloth':'wall',
 items:[['heart',430,462,.7,'#c94a46','On the tablecloth.'],['crown',600,160,.6,'#e1b552','On the top shelf with the jars.'],['key',930,395,.65,'#e6c99c','On the tiled wall, far right.'],['fish',175,118,.75,'#8cc3dc','Look out the window.'],['star',820,578,.7,'#a8714c','Down on the wooden floor.'],['feather',300,190,.7,'#5f9a4f','Hiding in the houseplant.'],['kite',400,90,.7,'#ead0a4','On the wall above the table.'],['bell',720,112,.55,'#8a9098','Hanging near the pots.'],['glasses',560,470,.65,'#ece2d6','Left on the table.']]},
{name:'Sunset beach',seed:37,
 draw(r){let s=`<defs><linearGradient id="bs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb07f"/><stop offset="1" stop-color="#ffe6c4"/></linearGradient></defs>${R(0,0,1000,320,'url(#bs)')}${C(500,300,72,'#ffcf6b')}`;
  [[120,90],[170,120],[700,70],[760,100],[900,160]].forEach(([x,y])=>s+=`<path d="M${x} ${y}q8-8 16 0q8-8 16 0" stroke="#6b5a55" stroke-width="3" fill="none"/>`);
  s+=R(0,300,1000,140,'#3f8fb5');
  for(let i=0;i<40;i++){const x=r()*960,y=310+r()*110;s+=`<path d="M${x.toFixed(0)} ${y.toFixed(0)}q10-6 20 0" stroke="#7fc0dc" stroke-width="3" fill="none"/>`}
  s+=`<path d="M240 330H350L330 352H260Z" fill="#8a5a3a"/><path d="M296 328V250L340 322Z" fill="#fffaf0"/><path d="M292 328V265L258 322Z" fill="#f6e4d0"/>`;
  s+=`<path d="M0 420Q250 400 500 425T1000 415V625H0Z" fill="#f2d49b"/>`;
  for(let i=0;i<220;i++)s+=C((r()*1000).toFixed(0),(430+r()*195).toFixed(0),(1+r()*1.6).toFixed(1),'#d9b87a');
  [[560,455,1],[720,495,1.15]].forEach(([x,y,k])=>{s+=`<path d="M${x} ${y}V${y+90*k}" stroke="#6b4a32" stroke-width="5"/><path d="M${x-80*k} ${y}A${80*k} ${55*k} 0 0 1 ${x+80*k} ${y}Z" fill="#e05a47"/>`;for(let j=-2;j<=2;j+=2)s+=`<path d="M${x} ${y-55*k}Q${x+j*18*k} ${y-30*k} ${x+j*36*k} ${y}" stroke="#fff3e6" stroke-width="${10*k}" fill="none"/>`});
  s+=`<g transform="rotate(-8 200 530)">${R(130,500,140,60,'#5fa8c9','rx="4"')}${R(130,515,140,10,'#fff3e6')}${R(130,540,140,10,'#fff3e6')}</g>`;
  s+=`<ellipse cx="870" cy="490" rx="80" ry="45" fill="#8a929a"/><ellipse cx="830" cy="505" rx="50" ry="32" fill="#a3abb2"/><ellipse cx="940" cy="515" rx="45" ry="28" fill="#7a8189"/>`;
  for(let i=0;i<16;i++){const x=40+r()*920,y=450+r()*165;s+=`<path d="M${x.toFixed(0)} ${y.toFixed(0)}l-9-12a12 12 0 0 1 18 0z" fill="${pick(r,['#f6b5a6','#fde1d3','#e9a18f'])}"/>`}
  return s},
 colorAt:(x,y)=>y<300?'#ffd2a6':y<425?'#3f8fb5':'#f2d49b',
 region:(x,y)=>y<300?'sky':y<425?'sea':'sand',
 items:[['fish',720,365,.75,'#4a9ac0','Swimming in the sea, right side.'],['star',60,560,.7,'#ebc98a','In the sand, far left.'],['umbrella',612,525,.7,'#e05a47','Near the big beach umbrellas.'],['cup',420,585,.65,'#ecce97','Half-buried in the sand.'],['glasses',862,478,.7,'#7d8790','Resting on the rocks.'],['crown',500,262,.65,'#ffbd5a','Glowing in the setting sun.'],['heart',300,338,.5,'#8a5a3a','Painted on the boat.'],['feather',820,125,.75,'#ffd3a6','Drifting in the sky, top right.'],['key',960,600,.6,'#e9c88c','Bottom right corner of the beach.']]}
];

let cur=0,items=[],sel=null,hints=0,vb={x:0,y:0,w:1000,h:625},toastT;
const toast=t=>{const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),1800)};

function load(i,shuffle){
 cur=i;sel=null;hints=0;$('win').hidden=true;const S=SC[i];
 const r=rng(S.seed*7+(shuffle?Math.floor(Math.random()*1e6):0));
 items=S.items.map(([k,x,y,s,c,clue])=>({k,x,y,s,c,clue,f:false,h:0,rot:Math.round((r()-.5)*50)}));
 if(shuffle){const placed=[];items.forEach(it=>{let x,y,t=0;do{x=60+r()*880;y=60+r()*505;t++}while(t<80&&placed.some(o=>Math.hypot(o.x-x,o.y-y)<95));it.x=x;it.y=y;placed.push(it);it.s=+(.55+r()*.3).toFixed(2);it.c=mix(S.colorAt(x,y),NAT[it.k],.32);it.clue=null})}
 const dr=rng(S.seed);let bg=S.draw(dr);
 const tk=new Set(items.map(t=>t.k)),others=Object.keys(NAMES).filter(k=>!tk.has(k));let dec='';
 for(let j=0;j<18;j++){const x=40+dr()*920,y=40+dr()*545;dec+=use(others[j%others.length],x,y,+(.5+dr()*.3).toFixed(2),mix(S.colorAt(x,y),NAT[others[j%others.length]],.32),Math.round((dr()-.5)*60))}
 svg.innerHTML=bg+dec+items.map(it=>use(it.k,it.x,it.y,it.s,it.c,it.rot)).join('')+'<g id="marks"></g><g id="hintg"></g><g id="fx"></g>';
 vb={x:0,y:0,w:1000,h:625};setVB();
 $('sname').textContent=S.name;$('hintmsg').textContent='Tap an item below to pick it, then tap Hint for help with that one.';
 $('tabs').innerHTML=SC.map((s,j)=>`<button class="tab" data-s="${j}" aria-current="${j===i}">${s.name}</button>`).join('');
 renderList();
}
function renderList(){
 $('list').innerHTML=items.map((it,j)=>`<li><button class="chip${it.f?' done':''}${sel===j?' sel':''}" data-j="${j}" aria-pressed="${sel===j}"><svg viewBox="-25 -25 50 50" aria-hidden="true"><use href="#i-${it.k}" x="-25" y="-25" width="50" height="50" style="color:${NAT[it.k]}"/></svg><span>${NAMES[it.k]}</span></button></li>`).join('');
 const n=items.filter(t=>t.f).length;$('count').textContent=`${n} of ${items.length} found`;
}
function where(it){const S=SC[cur],v=it.y<210?'top':it.y<420?'middle':'bottom',h=it.x<333?'left':it.x<667?'center':'right';return `Look in the ${S.region(it.x,it.y)}, ${v} ${h} of the picture.`}
function found(j){
 const it=items[j];it.f=true;
 $('marks').insertAdjacentHTML('beforeend',`<circle class="mark" cx="${it.x}" cy="${it.y}" r="${(30*it.s+10).toFixed(1)}"/>`);
 if($('hintg').dataset.j==j)$('hintg').innerHTML='';
 if(sel===j)sel=null;
 const left=items.filter(t=>!t.f).length;
 toast(left?`Found the ${NAMES[it.k].toLowerCase()}! ${left} to go`:`Found the ${NAMES[it.k].toLowerCase()}!`);
 $('hintmsg').textContent=left?'Nice spot. Keep looking!':'';
 renderList();
 if(!left)setTimeout(()=>{$('winmsg').textContent=hints?`You finished ${SC[cur].name} using ${hints} hint${hints>1?'s':''}.`:`You finished ${SC[cur].name} without a single hint!`;$('win').hidden=false},700);
}
function miss(p){const fx=$('fx');fx.insertAdjacentHTML('beforeend',`<circle class="ripple" cx="${p.x.toFixed(0)}" cy="${p.y.toFixed(0)}" r="${(vb.w/40).toFixed(1)}"/>`);const el=fx.lastElementChild;setTimeout(()=>el.remove(),650)}
function hint(){
 let j=sel!=null&&!items[sel].f?sel:items.findIndex(t=>!t.f);if(j<0)return;
 const it=items[j],hg=$('hintg'),nm=NAMES[it.k];it.h=Math.min(it.h+1,3);hints++;hg.dataset.j=j;
 if(it.h===1){hg.innerHTML='';$('hintmsg').textContent=`${nm}: ${it.clue||where(it)}`}
 else if(it.h===2){const r=rng(j*31+cur),cx=Math.min(870,Math.max(130,it.x+(r()-.5)*150)),cy=Math.min(500,Math.max(125,it.y+(r()-.5)*150));
  hg.innerHTML=`<circle class="ring2" cx="${cx.toFixed(0)}" cy="${cy.toFixed(0)}" r="160"/><circle class="ring" cx="${cx.toFixed(0)}" cy="${cy.toFixed(0)}" r="160"/>`;$('hintmsg').textContent=`${nm}: it's somewhere inside the glowing circle.`}
 else{hg.innerHTML=`<circle class="ring2" cx="${it.x}" cy="${it.y}" r="${(30*it.s+14).toFixed(0)}"/><circle class="ring" cx="${it.x}" cy="${it.y}" r="${(30*it.s+14).toFixed(0)}"/>`;$('hintmsg').textContent=`${nm}: right there in the small circle. Tap it!`}
}
function setVB(){vb.w=Math.min(1000,Math.max(220,vb.w));vb.h=vb.w*.625;vb.x=Math.min(1000-vb.w,Math.max(0,vb.x));vb.y=Math.min(625-vb.h,Math.max(0,vb.y));
 svg.setAttribute('viewBox',`${vb.x.toFixed(1)} ${vb.y.toFixed(1)} ${vb.w.toFixed(1)} ${vb.h.toFixed(1)}`);const z=vb.w<999;stage.classList.toggle('zoomed',z);svg.style.touchAction=z?'none':'pan-y'}
function zoomAt(f,cx,cy,base=vb){const nw=Math.min(1000,Math.max(220,base.w*f)),k=nw/base.w;vb={x:cx-(cx-base.x)*k,y:cy-(cy-base.y)*k,w:nw,h:nw*.625};setVB()}
const toSvg=(x,y)=>{const pt=svg.createSVGPoint();pt.x=x;pt.y=y;return pt.matrixTransform(svg.getScreenCTM().inverse())};
function tap(cx,cy){const p=toSvg(cx,cy),ppu=svg.getBoundingClientRect().width/vb.w;let best=-1,bd=1e9;
 items.forEach((it,j)=>{if(it.f)return;const d=Math.hypot(it.x-p.x,it.y-p.y),lim=Math.max(24*it.s+6,(matchMedia('(pointer:coarse)').matches?20:14)/ppu);if(d<lim&&d<bd){bd=d;best=j}});
 best>=0?found(best):miss(p)}

const pts=new Map();let start=null,moved=false,pinch=null;
const dist=()=>{const [a,b]=[...pts.values()];return Math.hypot(a.x-b.x,a.y-b.y)};
svg.addEventListener('pointerdown',e=>{try{svg.setPointerCapture(e.pointerId)}catch(_){}pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pts.size===1){start={x:e.clientX,y:e.clientY,vb:{...vb}};moved=false}
 else if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:dist(),vb:{...vb},mid:toSvg((a.x+b.x)/2,(a.y+b.y)/2)};moved=true}});
svg.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pts.size===2&&pinch){zoomAt(pinch.d/Math.max(dist(),1),pinch.mid.x,pinch.mid.y,pinch.vb)}
 else if(pts.size===1&&start){const dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.hypot(dx,dy)>8)moved=true;
  if(moved&&vb.w<999){const k=start.vb.w/svg.getBoundingClientRect().width;vb={...vb,x:start.vb.x-dx*k,y:start.vb.y-dy*k};setVB()}}});
const up=e=>{if(!pts.has(e.pointerId))return;if(e.type==='pointerup'&&pts.size===1&&!moved)tap(e.clientX,e.clientY);pts.delete(e.pointerId);
 if(pts.size<2)pinch=null;if(pts.size===1){const p=[...pts.values()][0];start={x:p.x,y:p.y,vb:{...vb}}}if(!pts.size)start=null};
svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
['gesturestart','gesturechange'].forEach(t=>stage.addEventListener(t,e=>e.preventDefault()));
svg.addEventListener('wheel',e=>{e.preventDefault();const p=toSvg(e.clientX,e.clientY);zoomAt(e.deltaY>0?1.15:.87,p.x,p.y)},{passive:false});
$('zin').onclick=()=>zoomAt(.6,vb.x+vb.w/2,vb.y+vb.h/2);
$('zout').onclick=()=>zoomAt(1/.6,vb.x+vb.w/2,vb.y+vb.h/2);
$('zreset').onclick=()=>{vb={x:0,y:0,w:1000,h:625};setVB()};
$('list').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const j=+b.dataset.j;if(items[j].f)return;sel=sel===j?null:j;renderList();
 $('hintmsg').textContent=sel===null?'Tap an item below to pick it, then tap Hint for help with that one.':`Looking for the ${NAMES[items[j].k].toLowerCase()}. Tap Hint if you need help.`};
$('tabs').onclick=e=>{const b=e.target.closest('.tab');if(b)load(+b.dataset.s,false)};
$('hint').onclick=hint;
$('shuffle').onclick=()=>load(cur,true);
$('again').onclick=()=>load(cur,true);
$('next').onclick=()=>load((cur+1)%SC.length,false);
load(0,false);
}
</script>
</body></html>
